<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status Ideas Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;padding:16px;padding-bottom:100px}
h1{font-size:28px;font-weight:700;margin-bottom:4px}
.subtitle{color:#888;font-size:14px;margin-bottom:24px}
.category{margin-bottom:32px}
.cat-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cat-icon{font-size:24px}
.cat-title{font-size:20px;font-weight:600}
.cat-count{background:#1a1a1a;color:#888;font-size:12px;padding:2px 8px;border-radius:10px}
.idea{background:#111;border-radius:12px;padding:14px 16px;margin-bottom:8px;transition:all 0.2s}
.idea:active{background:#1a1a1a;transform:scale(0.98)}
.idea-num{color:#555;font-size:12px;font-weight:600;margin-bottom:4px}
.idea-title{font-size:15px;font-weight:600;margin-bottom:4px}
.idea-desc{color:#999;font-size:13px;line-height:1.4}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:8px;margin-right:6px;margin-top:6px;font-weight:500}
.tag-immediate{background:#0a2a0a;color:#4ade80}
.tag-short{background:#1a1a00;color:#facc15}
.tag-medium{background:#1a0a00;color:#fb923c}
.tag-long{background:#1a0015;color:#c084fc}
.tag-partnership{background:#001a1a;color:#22d3ee}
.tag-growth{background:#0a001a;color:#818cf8}
.tag-feature{background:#1a0a1a;color:#f472b6}
.tag-data{background:#0a1a0a;color:#34d399}
.tag-city{background:#0a0a1a;color:#60a5fa}
.tag-quick{background:#2a0a0a;color:#f87171}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:24px}
.stat{background:#111;border-radius:12px;padding:14px;text-align:center}
.stat-num{font-size:28px;font-weight:700}
.stat-label{color:#888;font-size:11px;margin-top:2px}
.filter-bar{display:flex;gap:8px;overflow-x:auto;margin-bottom:20px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.filter-bar::-webkit-scrollbar{display:none}
.filter{background:#1a1a1a;color:#888;border:none;padding:8px 16px;border-radius:20px;font-size:13px;white-space:nowrap;cursor:pointer;-webkit-tap-highlight-color:transparent}
.filter.active{background:#fff;color:#000;font-weight:600}
.hidden{display:none}
.search{width:100%;background:#111;border:none;color:#fff;padding:12px 16px;border-radius:12px;font-size:15px;margin-bottom:16px;outline:none}
.search::placeholder{color:#555}
</style>
</head>
<body>

<h1>Status Ideas Engine 🏆</h1>
<p class="subtitle">Living document · Updated by Sosa</p>

<input type="text" class="search" placeholder="Search ideas..." id="search">

<div class="stats">
<div class="stat"><div class="stat-num" id="totalCount">69</div><div class="stat-label">Total Ideas</div></div>
<div class="stat"><div class="stat-num" id="revCount">22</div><div class="stat-label">Revenue</div></div>
<div class="stat"><div class="stat-num" id="partnerCount">17</div><div class="stat-label">Partnerships</div></div>
</div>

<div class="filter-bar" id="filters">
<button class="filter active" data-cat="all">All</button>
<button class="filter" data-cat="revenue">💰 Revenue</button>
<button class="filter" data-cat="partnerships">🤝 Partners</button>
<button class="filter" data-cat="growth">🚀 Growth</button>
<button class="filter" data-cat="features">🧠 Features</button>
<button class="filter" data-cat="data">📊 Data</button>
<button class="filter" data-cat="cities">🏙️ Cities</button>
<button class="filter" data-cat="quick">🎯 Quick Wins</button>
</div>

<div id="ideas-container"></div>

const quickWins = [
  "Birthday detection from ID scans → auto-offer pipeline",
  "Promoter dashboard MVP (show them their numbers)",
  "'Share your night' social feature → organic growth",
  "Push notification system for venue promotions",
  "Uber/Lyft deep link at closing time"
];

let activeFilter = 'all';

function render(filter, query='') {
  const container = document.getElementById('ideas-container');
  let filtered = ideas;
  if (filter !== 'all') filtered = filtered.filter(i => i.cat === filter);
  if (query) {
    const q = query.toLowerCase();
    filtered = filtered.filter(i => i.title.toLowerCase().includes(q) || i.desc.toLowerCase().includes(q));
  }

  let html = '';

  if (filter === 'all' || filter === 'quick') {
    html += '<div class="category"><div class="cat-header"><span class="cat-icon">🎯</span><span class="cat-title">Quick Wins</span><span class="cat-count">'+quickWins.length+'</span></div>';
    quickWins.forEach((w,i) => {
      html += '<div class="idea"><div class="idea-title">'+w+'</div><span class="tag tag-quick">This Week</span></div>';
    });
    html += '</div>';
  }

  const cats = {revenue:'💰 Revenue',partnerships:'🤝 Partnerships',growth:'🚀 Growth',features:'🧠 Features',data:'📊 Data',cities:'🏙️ Cities'};

  Object.keys(cats).forEach(cat => {
    const items = filtered.filter(i => i.cat === cat);
    if (!items.length) return;
    html += '<div class="category"><div class="cat-header"><span class="cat-title">'+cats[cat]+'</span><span class="cat-count">'+items.length+'</span></div>';
    items.forEach(i => {
      html += '<div class="idea"><div class="idea-num">#'+i.n+'</div><div class="idea-title">'+i.title+'</div><div class="idea-desc">'+i.desc+'</div><span class="tag '+i.tagClass+'">'+i.tag+'</span></div>';
    });
    html += '</div>';
  });

  container.innerHTML = html;
}

document.querySelectorAll('.filter').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.cat;
    render(activeFilter, document.getElementById('search').value);
  });
});

document.getElementById('search').addEventListener('input', e => {
  render(activeFilter, e.target.value);
});

render('all');
</script>
</body>
</html>
